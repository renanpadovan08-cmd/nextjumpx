<body class="zenIsLoading">
  <div id="toast"></div>
  <div id="zenGlobalLoader" class="zenGlobalLoader isVisible" aria-live="polite" aria-busy="true">
    <div class="zenLoaderPanel">
      <img src="/nextjumpx-symbol.png" alt="" class="zenLoaderLogo">
      <div class="zenLoaderText"><span id="zenLoaderMessage">Carregando</span><span class="zenLoaderDots" aria-hidden="true"><i></i><i></i><i></i></span></div>
    </div>
  </div>
  <div id="root"></div>

  <script>
    window.renderZenStartupError = function(message){
      clearTimeout(window.__zenStartupWatchdog);
      var loader = document.getElementById('zenGlobalLoader');
      var root = document.getElementById('root');
      if(loader){ loader.classList.remove('isVisible'); loader.hidden = true; }
      document.body.classList.remove('zenIsLoading');
      if(root) root.innerHTML = '<div class="page"><div class="card"><h2>Não foi possível abrir o ZenBarber</h2><p class="muted">'+String(message || 'Verifique sua conexão e tente novamente.')+'</p><button class="primary" onclick="location.reload()">Tentar novamente</button></div></div>';
    };
    window.__zenStartupWatchdog = setTimeout(function(){
      if(!window.__zenBarberReady) window.renderZenStartupError('O carregamento demorou mais que o esperado. Verifique sua conexão e tente novamente.');
    }, 30000);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="renderZenStartupError('Não foi possível carregar a conexão com o sistema. Verifique sua internet e tente novamente.')"></script>
  <script src="js/core.js?v=20260714-loading-final"></script>
  <script src="js/modules/auth.js?v=20260714-loading-final"></script>

  <script src="js/modules/caixa.js?v=20260618-brand-pro2"></script>
  <script src="js/modules/clientesFixos.js?v=20260618-brand-pro2"></script>
  <script src="js/modules/relatorios.js?v=20260618-brand-pro2"></script>
  <script src="js/modules/supportChat.js?v=20260619-support-chat"></script>
  <script src="js/modules/admin.js?v=20260618-brand-pro2"></script>
  <script src="js/modules/meuNegocio.js?v=20260618-brand-pro2"></script>
  <script src="js/modules/agendamentoPublico.js?v=20260618-brand-pro2"></script>
  <script src="js/bootstrap.js?v=20260714-loading-final"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js?v=20260714-loading-final").catch(function (error) {
          console.warn("ZenBarber PWA: service worker não registrado", error);
        });
      });
    }
  </script>
