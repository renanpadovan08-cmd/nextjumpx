<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030712">
  <meta name="description" content="ZenBarber Pro — gestão premium para barbearias.">
  <title>ZenBarber Pro</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.zenInstallPrompt = null;
    window.zenCanInstall = false;

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      window.zenInstallPrompt = event;
      window.zenCanInstall = true;
      window.dispatchEvent(new CustomEvent('zen-install-available'));
    });

    window.addEventListener('appinstalled', () => {
      window.zenInstallPrompt = null;
      window.zenCanInstall = false;
    });

    window.zenPromptInstall = async () => {
      const prompt = window.zenInstallPrompt;
      if (!prompt) return false;
      prompt.prompt();
      const choice = await prompt.userChoice;
      window.zenInstallPrompt = null;
      window.zenCanInstall = false;
      return choice && choice.outcome === 'accepted';
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
